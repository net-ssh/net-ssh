name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # HEAD is the PR merged into the base branch; HEAD^1 is the base it was merged into.
          fetch-depth: 2
      - uses: net-ssh/changelogd@v1
