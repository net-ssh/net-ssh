name: Rubocop

on:
  pull_request:
  push: { branches: master }

jobs:
  build:
    # setup-ruby has no builds of Ruby 3.1 and older for ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
      - name: Set up Ruby 3.1
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop
